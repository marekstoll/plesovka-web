name: PULS3 IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages
        run: sleep 120

      - name: Notify IndexNow
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json; charset=utf-8" \
            --data '{
              "host": "puls3.cz",
              "key": "8d78ea7268e54c7b91994c6610ef8a46",
              "keyLocation": "https://puls3.cz/8d78ea7268e54c7b91994c6610ef8a46.txt",
              "urlList": [
                "https://puls3.cz/",
                "https://puls3.cz/soutez/"
              ]
            }' \
            --write-out "\nHTTP %{http_code}\n" \
            "https://api.indexnow.org/indexnow"
